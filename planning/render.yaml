services:
  - type: web
    name: protec-planning
    runtime: python
    rootDir: planning
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 30
    envVars:
      - key: ODOO_URL
        value: https://protec-s3t.odoo.com
      - key: ODOO_DB
        value: protec-s3t
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASSWORD
        sync: false
