<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a3b2e">
<title>Chauffeur — Bons de transport</title>
<style>
  :root{
    --bg:#f4f4f5; --card:#ffffff; --line:#e4e4e7; --txt:#18181b; --muted:#71717a;
    --brand:#7a3b2e; --brand2:#9a4d3c; --ok:#15803d; --okbg:#dcfce7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;
       background:var(--bg);color:var(--txt);font-size:16px}
  #root{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;
          padding:14px 16px;display:flex;align-items:center;gap:10px;
          box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .topbar h1{font-size:16px;margin:0;font-weight:600;flex:1;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:rgba(255,255,255,.18);border:0;color:#fff;
                 padding:8px 12px;border-radius:8px;font-size:14px}
  .content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .task{cursor:pointer}
  .task:active{background:#fafafa}
  .task .name{font-weight:600;margin-bottom:4px}
  .task .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .badge{background:#eef2ff;color:#4338ca;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:14px}
  input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);
        border-radius:9px;font-size:16px;background:#fff;color:var(--txt)}
  textarea{min-height:72px;resize:vertical}
  .row-check{display:flex;align-items:center;gap:10px}
  .row-check input{width:22px;height:22px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:11px;
       font-size:16px;font-weight:600;color:#fff;background:var(--brand)}
  .btn:active{background:var(--brand2)}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn.ok{background:var(--ok)}
  .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
           padding:12px 0;display:flex;flex-direction:column;gap:8px}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .pinpad button{padding:20px;font-size:22px;border:1px solid var(--line);
                 border-radius:12px;background:#fff;font-weight:600}
  .pinpad button:active{background:#f1f1f1}
  .pin-display{font-size:34px;letter-spacing:14px;text-align:center;
               height:48px;color:var(--brand);font-weight:700}
  .thumb{width:100%;max-height:200px;object-fit:contain;border:1px solid var(--line);
         border-radius:9px;margin-top:8px;background:#fafafa}
  .sig{border:1px dashed var(--line);border-radius:9px;background:#fff;touch-action:none;width:100%;height:160px}
  .muted{color:var(--muted);font-size:13px}
  .err{color:#b91c1c;font-size:14px;text-align:center;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
         background:#18181b;color:#fff;padding:10px 18px;border-radius:24px;
         font-size:14px;z-index:50;opacity:.95}
  .hidden-file{display:none}
  .center{text-align:center;color:var(--muted);padding:40px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

// ====================== CONFIG ======================
const API_BASE = "https://TON-BACKEND.onrender.com";   // <<< URL de ton backend Render
const SIGNATURE_FIELD = "";   // ex "x_studio_signature_destinataire" pour activer le pad signature
const DONE_STAGE = "TRANSPORT REALISE";
// ====================================================

// ---- token (persisté, protégé pour ne pas planter l'aperçu) ----
const store = {
  get(){ try{return localStorage.getItem("drv_tok")}catch(e){return null} },
  set(v){ try{ v?localStorage.setItem("drv_tok",v):localStorage.removeItem("drv_tok") }catch(e){} }
};

async function api(path, {method="GET", body, token}={}){
  const r = await fetch(API_BASE+path, {
    method,
    headers: {"Content-Type":"application/json", ...(token?{"Authorization":"Bearer "+token}:{})},
    body: body?JSON.stringify(body):undefined
  });
  if(r.status===401){ store.set(null); location.reload(); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || ("Erreur "+r.status));
  return data;
}

function fileToB64(file, max=1280, q=0.7){
  return new Promise((res, rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>max){h=h*max/w; w=max;} else if(h>=w && h>max){w=w*max/h; h=max;}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg",q).split(",")[1]);
    };
    img.onerror=rej; img.src=url;
  });
}

// ====================== LOGIN ======================
function Login({onLogged}){
  const [pin,setPin]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const press=(d)=>{ setErr(""); if(d==="C") setPin(""); else if(d==="<") setPin(p=>p.slice(0,-1)); else if(pin.length<6) setPin(p=>p+d); };
  const submit=async()=>{
    setBusy(true); setErr("");
    try{ const r=await api("/api/login",{method:"POST",body:{pin}}); store.set(r.token); onLogged(r.name); }
    catch(e){ setErr(e.message); setPin(""); }
    finally{ setBusy(false); }
  };
  return (
    <div style={{padding:24,marginTop:30}}>
      <h1 style={{textAlign:"center",color:"var(--brand)"}}>Connexion chauffeur</h1>
      <p className="muted" style={{textAlign:"center"}}>Saisis ton code PIN</p>
      <div className="pin-display">{pin.replace(/./g,"•")}</div>
      <div className="pinpad">
        {["1","2","3","4","5","6","7","8","9","C","0","<"].map(d=>
          <button key={d} onClick={()=>press(d)}>{d}</button>)}
      </div>
      <button className="btn" style={{marginTop:16}} disabled={busy||pin.length<2} onClick={submit}>
        {busy?"…":"Valider"}
      </button>
      {err && <div className="err">{err}</div>}
    </div>
  );
}

// ====================== LISTE ======================
function TaskList({token, onOpen}){
  const [tasks,setTasks]=useState(null); const [err,setErr]=useState("");
  useEffect(()=>{ api("/api/tasks",{token}).then(setTasks).catch(e=>setErr(e.message)); },[token]);
  if(err) return <div className="err">{err}</div>;
  if(!tasks) return <div className="center">Chargement…</div>;
  if(!tasks.length) return <div className="center">Aucune tâche.</div>;
  return tasks.map(t=>(
    <div key={t.id} className="card task" onClick={()=>onOpen(t.id)}>
      <div className="name">{t.name}</div>
      <div className="meta">
        {t.partner_id && <span>{t.partner_id[1]}</span>}
        {t.planned_date_begin && <span>{t.planned_date_begin}</span>}
        {t.stage_id && <span className="badge">{t.stage_id[1]}</span>}
      </div>
    </div>
  ));
}

// ====================== CHAMP DYNAMIQUE ======================
function Field({f, value, onChange, onPhoto}){
  const id="f_"+f.name;
  if(f.type==="binary"){
    const fileRef=useRef();
    return (
      <div className="field">
        <label>{f.label}</label>
        <button className="btn ghost" onClick={()=>fileRef.current.click()}>📷 Prendre / choisir une photo</button>
        <input ref={fileRef} className="hidden-file" type="file" accept="image/*" capture="environment"
               onChange={async e=>{ const file=e.target.files[0]; if(file){ const b64=await fileToB64(file); onPhoto(f.name,b64);} }}/>
        {value && <img className="thumb" src={"data:image/jpeg;base64,"+value} alt=""/>}
      </div>
    );
  }
  if(f.type==="boolean")
    return <div className="field row-check"><input id={id} type="checkbox" checked={!!value}
            onChange={e=>onChange(f.name,e.target.checked)}/><label htmlFor={id} style={{margin:0}}>{f.label}</label></div>;
  if(f.type==="selection")
    return <div className="field"><label>{f.label}</label>
            <select value={value||""} onChange={e=>onChange(f.name,e.target.value||false)}>
              <option value="">—</option>
              {(f.selection||[]).map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select></div>;
  if(f.type==="text")
    return <div className="field"><label>{f.label}</label>
            <textarea value={value||""} onChange={e=>onChange(f.name,e.target.value)}/></div>;
  if(["integer","float","monetary"].includes(f.type))
    return <div className="field"><label>{f.label}</label>
            <input type="number" inputMode="decimal" value={value??""} onChange={e=>onChange(f.name,e.target.value===""?false:Number(e.target.value))}/></div>;
  if(f.type==="many2one")
    return <div className="field"><label>{f.label}</label>
            <input value={Array.isArray(value)?value[1]:""} disabled placeholder="(non éditable ici)"/></div>;
  const t = f.type==="date"?"date":(f.type==="datetime"?"datetime-local":"text");
  return <div className="field"><label>{f.label}</label>
          <input type={t} value={value||""} onChange={e=>onChange(f.name,e.target.value)}/></div>;
}

// ====================== PAD SIGNATURE ======================
function SignaturePad({onSave}){
  const ref=useRef(); const drawing=useRef(false);
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext("2d");
    const r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=160;
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.strokeStyle="#18181b";
    const pos=e=>{const b=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-b.left,p.clientY-b.top];};
    const down=e=>{drawing.current=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault();};
    const move=e=>{if(!drawing.current)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault();};
    const up=()=>{drawing.current=false;};
    cv.addEventListener("pointerdown",down);cv.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
    return ()=>{cv.removeEventListener("pointerdown",down);cv.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);};
  },[]);
  const clear=()=>{const cv=ref.current;cv.getContext("2d").clearRect(0,0,cv.width,cv.height);};
  const save=()=>onSave(ref.current.toDataURL("image/png").split(",")[1]);
  return (<div className="field"><label>Signature</label>
    <canvas ref={ref} className="sig"></canvas>
    <div style={{display:"flex",gap:8,marginTop:8}}>
      <button className="btn ghost" onClick={clear}>Effacer</button>
      <button className="btn" onClick={save}>Valider la signature</button>
    </div></div>);
}

// ====================== DÉTAIL ======================
function TaskDetail({token, id, onBack, toast}){
  const [d,setD]=useState(null); const [vals,setVals]=useState({}); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  useEffect(()=>{ api("/api/tasks/"+id,{token}).then(r=>{ setD(r); setVals(r.worksheet||{}); }).catch(e=>setErr(e.message)); },[id,token]);
  const onChange=(k,v)=>setVals(p=>({...p,[k]:v}));
  const uploadPhoto=async(field,b64,target)=>{
    try{ await api("/api/tasks/"+id+"/photo",{method:"POST",token,body:{field,data:b64,target}}); onChange(field,b64); toast("Photo enregistrée"); }
    catch(e){ toast("Erreur photo : "+e.message); }
  };
  const save=async()=>{
    setBusy(true);
    try{
      const payload={}; (d.schema||[]).forEach(f=>{ if(f.type!=="binary" && f.type!=="many2one" && !f.readonly && vals[f.name]!==undefined) payload[f.name]=vals[f.name]; });
      await api("/api/tasks/"+id+"/worksheet",{method:"POST",token,body:payload});
      toast("Feuille enregistrée");
    }catch(e){ toast("Erreur : "+e.message); } finally{ setBusy(false); }
  };
  const done=async()=>{ setBusy(true); try{ await save(); await api("/api/tasks/"+id+"/done",{method:"POST",token,body:{stage:DONE_STAGE}}); toast("Tâche terminée"); onBack(); }catch(e){toast(e.message);} finally{setBusy(false);} };

  if(err) return <div className="err">{err}</div>;
  if(!d) return <div className="center">Chargement…</div>;
  const t=d.task;
  return (<div>
    <div className="card">
      <div className="name" style={{fontSize:17}}>{t.name}</div>
      <div className="meta" style={{marginTop:6}}>
        {t.partner_id && <span>👤 {t.partner_id[1]}</span>}
        {t.planned_date_begin && <span>🕒 {t.planned_date_begin}</span>}
      </div>
    </div>
    {(d.schema||[]).map(f=> f.readonly ? null :
      <div key={f.name} className="card" style={{padding:"12px 14px"}}>
        <Field f={f} value={vals[f.name]} onChange={onChange} onPhoto={(field,b64)=>uploadPhoto(field,b64)}/>
      </div>)}
    {SIGNATURE_FIELD &&
      <div className="card"><SignaturePad onSave={b64=>uploadPhoto(SIGNATURE_FIELD,b64)}/></div>}
    <div className="savebar">
      <button className="btn" disabled={busy} onClick={save}>{busy?"…":"💾 Enregistrer"}</button>
      <button className="btn ok" disabled={busy} onClick={done}>✅ Terminer la tâche</button>
    </div>
  </div>);
}

// ====================== APP ======================
function App(){
  const [token,setToken]=useState(store.get());
  const [name,setName]=useState("");
  const [openId,setOpenId]=useState(null);
  const [toastMsg,setToastMsg]=useState("");
  const toast=useCallback(m=>{ setToastMsg(m); setTimeout(()=>setToastMsg(""),2200); },[]);
  const logout=()=>{ store.set(null); setToken(null); setOpenId(null); };

  if(!token) return <Login onLogged={n=>{ setName(n); setToken(store.get()); }}/>;
  return (<div>
    <div className="topbar">
      {openId ? <button onClick={()=>setOpenId(null)}>← Retour</button> : <span style={{width:4}}/>}
      <h1>{openId?"Feuille de travail":("Mes tâches"+(name?" — "+name:""))}</h1>
      <button onClick={logout}>Quitter</button>
    </div>
    <div className="content">
      {openId
        ? <TaskDetail token={token} id={openId} onBack={()=>setOpenId(null)} toast={toast}/>
        : <TaskList token={token} onOpen={setOpenId}/>}
    </div>
    {toastMsg && <div className="toast">{toastMsg}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
